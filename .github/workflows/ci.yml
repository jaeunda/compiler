name: CI Build and Test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build deps
        run: sudo apt-get update && sudo apt-get install -y build-essential

      - name: Build the project
        id: build_step
        shell: bash
        run: | 
            gcc ./01-simple-rd-parser/rd-parser.c -o simple-rd-parser
            gcc ./02-rd-parser/rd-parser.c -o rd-parser
            gcc ./03-LR-parser/LR-parser.c -o LR-parser
            cd 05-c-language-parser && cc main.c lex.yy.c y.tab.c
            cd 06-c-syntax-analyzer && make && make clean
            cd 07-c-semantic-analyzer && make && make clean
            cd 08-code-generator && make && make clean
